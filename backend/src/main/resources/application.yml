server:
  port: 4000

spring:
  mvc:
    async:
      # The streaming endpoint holds a request open for the whole tool loop, which is a dozen
      # model calls. The container default is 30 seconds — long enough that a short Gemini run
      # slips under it and looks fine, and far too short for anything else: the async thread is
      # interrupted mid-call, the HTTP send throws InterruptedException with no message, and the
      # panel reports "I couldn't reach the model" about a model that was answering normally.
      # A local model at 65-300 seconds a request would never once have succeeded.
      request-timeout: 900000

processdesk:
  # Where editable BPMN and DMN assets live. Kept outside src/main/resources so saves
  # do not require a rebuild.
  assets-dir: ./assets
  audit-file: ./audit.log

  # "ollama" runs the local model and is what this is now aimed at — laptops and servers
  # short on CPU compute, nothing leaving the machine. "dummy" answers from the file itself
  # and stays the default only because it needs nothing installed, which is what makes a
  # fresh clone work. "gemini" is no longer a target; the class is kept because the provider
  # seam is what makes two models comparable, not because the hosted one is coming back.
  #
  # Switching this changes what the system understands, not how it edits or validates —
  # every provider goes through the same gates and the same editors.
  # Set AI_PROVIDER in .env to change it without editing this file.
  ai-provider: ${AI_PROVIDER:dummy}

  # Lets a provider that supports tool calling look at the decision model, change it, check
  # its own work, and fix what it broke — instead of getting one guess at one edit from a
  # projection chosen for it in advance. Providers that can't call tools ignore this and use
  # the one-shot path, which remains the floor every provider meets.
  tool-loop:
    enabled: ${TOOL_LOOP:true}
    # A model that never calls done is a real failure of small local models, and an unbounded
    # conversation spends a quota or a laptop rather than admitting it is stuck.
    #
    # Twelve, because eight was measured to be exactly enough and therefore too few. A
    # two-part edit that corrects itself runs list, show, set, check, show, set, check, done —
    # eight turns with nothing spare, so gpt-oss:20b hit the cap having made one of the two
    # changes and the proposal was withheld for the overlap the other would have fixed.
    max-turns: ${TOOL_LOOP_MAX_TURNS:12}

  # Worked examples, fetched only when a decision's coverage check has failed twice — which is
  # a model whose corrections have stopped converging, and the only state where a few hundred
  # tokens of somebody else's table is worth the seconds it costs to prefill.
  #
  # The corpus is the DMN Technology Compatibility Kit: models the specification says must
  # produce particular answers, which is the one body of DMN here that is known correct rather
  # than merely real. It is gitignored and rebuilt by scripts/fetch-corpora.sh, so a clone that
  # has never run that script has no examples and behaves exactly as it did before. Indexing is
  # lazy and skipped entirely when the directory is absent.
  examples:
    dir: ${EXAMPLES_DIR:../corpora/dmn-tck}
    enabled: ${EXAMPLES_ENABLED:true}

  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    # gpt-oss:20b is the only local model benchmarked end to end here (17/20) and is a
    # mixture-of-experts with 3.6B active, which is what both prefill and generation are
    # actually charged for. On a CPU-only machine that matters more than it does on a GPU.
    model: ${OLLAMA_MODEL:gpt-oss:20b}

    # Private reasoning is tokens paid for and never read. Measured here on ornith:9b, the same
    # request producing the same tool call: 15 generated tokens with thinking off against 52
    # with it on, 0.85s against 3.25s. The schema is the thinking.
    #
    # A model with no thinking to disable answers 400 to this option. The provider notices,
    # drops it, and retries once, so an unusual model costs one refusal per run rather than
    # every request.
    think: ${OLLAMA_THINK:false}

    # Ollama defaults to 4096, which silently truncates.
    #
    # An earlier plan was to cut this to 4096 now that the preamble is a fifth of what it was.
    # That is no longer safe: a failing write returns the re-rendered table, so a conversation
    # is shorter in turns and fatter per turn. Memory is the resource this deployment has;
    # context is where to spend it. Set OLLAMA_KV_CACHE_TYPE=q8_0 on the server if the KV cache
    # is what hurts.
    num-ctx: ${OLLAMA_NUM_CTX:8192}

    # Zero, not 0.1. Choosing which tool to call and which rule number to name is classification,
    # and sampling variance on a classification is pure downside. Measured here on the two-part
    # DTI request: at 0.1 one run made both edits and self-corrected, and the next made one and
    # ran out of turns.
    temperature: ${OLLAMA_TEMPERATURE:0}

    # Without this the model unloads after 5 minutes and the next request pays to reload it.
    # On a server, -1 never unloads, which is worth it: loading 13-24 GB is a cold start nobody
    # is waiting through, and it happens silently.
    keep-alive: ${OLLAMA_KEEP_ALIVE:30m}

    # Ollama's default is unbounded generation, which is how "explain this file" became a crash:
    # a 14B at ~11 tok/s reaches the client timeout at roughly 1,300 tokens, and the failure is
    # reported as "I couldn't reach the local model" about a model that was answering the whole
    # time. A reply that stops mid-sentence is a visible fault; one that never stops is
    # misdiagnosed as a network error.
    #
    # Two budgets, because the risk is not the same. A schema already bounds a structured reply,
    # so 512 is headroom. Prose has no such bound, and EXPLAIN asks for one sentence and three
    # short bullets.
    num-predict: ${OLLAMA_NUM_PREDICT:512}
    num-predict-prose: ${OLLAMA_NUM_PREDICT_PROSE:200}

    # --- CPU tuning. Unset by default, and sent to Ollama only when set. -------------------
    # Ollama picks these from the machine and is usually right. They are here for the machine
    # where it is not, and every one of them is a measurement to take rather than a value to
    # guess. See docs/12-small-model-adaptation.md for what each one does on a CPU.
    #
    # num-batch   prefill batch size, default 512. Prefill on a CPU is compute bound, and a
    #             larger batch raises arithmetic intensity, which is exactly what that wants.
    #             It costs memory, which this deployment has. 1024 and 2048 are worth measuring.
    # num-thread  defaults to physical cores. On a many-core server prefill scales with threads
    #             until memory bandwidth saturates; on a laptop, going past physical cores makes
    #             it worse.
    # num-gpu     layers to offload. 0 pins the model to the CPU, which on a box with a weak
    #             iGPU can be faster than partial offload and is easier to reason about.
    num-batch: ${OLLAMA_NUM_BATCH:-1}
    num-thread: ${OLLAMA_NUM_THREAD:-1}
    num-gpu: ${OLLAMA_NUM_GPU:-1}

    # Generous enough to cover the first request, which loads the model — and on a CPU-only
    # machine that is a long way from generous at 120 seconds. Loading 13 GB from disk and then
    # prefilling a couple of thousand tokens at 15-25 tok/s can pass two minutes before the
    # model has done anything wrong, and what the user is shown for it is "I couldn't reach the
    # local model" about a model that was working.
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:600}

  gemini:
    base-url: https://generativelanguage.googleapis.com/v1beta
    # Flash is the right size for this work: the model picks one of four kinds and names a
    # value from an enum. Flash-lite has a larger free-tier daily quota if that is the
    # binding limit; Pro is only worth it if explanations need it.
    # Models are retired, and a key issued afterwards gets a 404 rather than a warning —
    # gemini-2.5-flash was the first default here and is already gone for new keys. List
    # what a key can reach:
    #   curl -H "x-goog-api-key: $GEMINI_API_KEY" \
    #     https://generativelanguage.googleapis.com/v1beta/models
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    # Never written here. Put it in .env at the project root, which is gitignored.
    api-key: ${GEMINI_API_KEY:}
    # Zero, not 0.1. Picking which kind of edit a sentence describes is a classification,
    # and sampling variance on a classification is pure downside: measured at 0.1, the same
    # request chose SET_CONDITION_WHERE twice and SET_CONDITION once, and the third run was
    # refused. Prose is a little flatter at 0; a coin-flip on an edit is worse.
    temperature: 0
    # Gemini thinks by default and charges latency for it on a request whose whole job is
    # picking one of four kinds. 0 turns it off; -1 does not send the setting at all.
    # Measured on gemini-3.5-flash: 0.7s with it off against 1.3s with it on, same answer.
    # Not every model accepts it — flash-lite and flash-latest answer 400 — so the provider
    # drops it and retries once rather than making you know which family you are on.
    thinking-budget: 0
    timeout-seconds: 60
    # Free-tier requests per day, per model — Google publishes no endpoint for what is left,
    # so /api/health counts what this application spends and reports it against this number.
    # flash-lite is 500/day and 15/min; the full Flash models are 20/day and 5/min, which is
    # a 25x difference and the reason flash-lite is the default. 0 means "unknown", and the
    # count is still reported without a ceiling. Check yours: https://ai.dev/rate-limit
    daily-limit: ${GEMINI_DAILY_LIMIT:0}

logging:
  level:
    org.drools: WARN
    org.jbpm: WARN
    org.kie: WARN
